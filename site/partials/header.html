<header class="site-header">
  <div class="site-header__left">
    <a href="index.html" class="site-header__logo">
      <img src="assets/prophet-logo-transparent.svg" alt="" class="site-header__mark" width="48" height="48">
      <img src="assets/wordmark_offwhite.svg" alt="The Prophet" class="site-header__wordmark">
    </a>
    <a href="#how-it-works" class="site-header__hiw heading">How it Works</a>
  </div>

  <!-- Desktop nav -->
  <nav class="site-header__nav">
    <a href="prophecies.html">Prophecies</a>
    <a href="record.html">Record</a>
    <a href="prophet.html">$Prophet</a>
    <a href="{{docs_url}}" target="_blank" rel="noopener">Docs</a>
    <button class="site-header__ca" data-ca="{{contract_address}}" data-ca-copy title="Copy contract address" aria-label="Copy contract address">
      <span class="site-header__ca-label heading">CA</span>
      <span class="site-header__ca-text" data-ca-text></span>
      <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="1.5"/><path d="M5 15V5a1 1 0 0 1 1-1h10"/></svg>
    </button>
  </nav>

  <!-- Mobile menu button -->
  <button class="site-header__menu-btn" aria-label="Menu" aria-expanded="false" data-menu-toggle>
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke-width="2" stroke-linecap="round">
      <line x1="4" y1="6" x2="20" y2="6"/>
      <line x1="4" y1="12" x2="20" y2="12"/>
      <line x1="4" y1="18" x2="20" y2="18"/>
    </svg>
  </button>

  <!-- Mobile panel -->
  <nav class="site-header__mobile-panel" data-menu-panel>
    <a href="#how-it-works">How it Works</a>
    <a href="index.html">Home</a>
    <a href="prophecies.html">Prophecies</a>
    <a href="record.html">Record</a>
    <a href="prophet.html">$Prophet</a>
    <a href="{{docs_url}}" target="_blank" rel="noopener">Docs</a>
    <button class="site-header__ca site-header__ca--mobile" data-ca="{{contract_address}}" data-ca-copy title="Copy contract address" aria-label="Copy contract address">
      <span class="site-header__ca-label heading">CA</span>
      <span class="site-header__ca-text" data-ca-text></span>
      <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="1.5"/><path d="M5 15V5a1 1 0 0 1 1-1h10"/></svg>
    </button>
    <div class="account">{{username}}</div>
  </nav>
</header>
